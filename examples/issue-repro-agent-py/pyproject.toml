[project]
name = "issue-repro-agent"
version = "0.1.0"
description = "GitHub bug issue -> reproduced failing test -> PR, chaining Solari browser + sandbox + git."
requires-python = ">=3.9"
dependencies = [
    "solari-browser>=0.1.3",
    "solari-sandbox>=0.2.0",
    "anthropic>=0.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
repro-agent = "repro_agent.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["repro_agent"]
